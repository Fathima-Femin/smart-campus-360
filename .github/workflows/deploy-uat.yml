name: Salesforce UAT Deployment

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global
          sf --version

      - name: Authenticate UAT Org
        run: |
          echo "${{ secrets.SC360_UAT_AUTH_URL }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias UAT

          rm auth.txt

      - name: Get Changed Metadata
        id: changed
        shell: bash
        run: |

          echo "========================================"
          echo "Changed Salesforce Metadata"
          echo "========================================"

          git diff --name-status \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            -- force-app

          mapfile -t CHANGED_FILES < <(
            git diff --name-only \
              --diff-filter=ACMR \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              -- force-app
          )

          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "No Salesforce metadata changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "========================================"
          echo "Files to deploy:"
          echo "========================================"

          printf '%s\n' "${CHANGED_FILES[@]}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          {
            echo "files<<EOF"
            printf '%s\n' "${CHANGED_FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Changed Metadata
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |

          echo "========================================"
          echo "Validating Changed Metadata"
          echo "========================================"

          mapfile -t FILES <<< "$CHANGED_FILES"

          DEPLOY_ARGS=()

          for FILE in "${FILES[@]}"; do
            if [ -n "$FILE" ]; then
              DEPLOY_ARGS+=(--source-dir "$FILE")
            fi
          done

          sf project deploy start \
            --target-org UAT \
            "${DEPLOY_ARGS[@]}" \
            --test-level RunLocalTests \
            --dry-run \
            --wait 60

      - name: Deploy Changed Metadata
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |

          echo "========================================"
          echo "Deploying Changed Metadata"
          echo "========================================"

          mapfile -t FILES <<< "$CHANGED_FILES"

          DEPLOY_ARGS=()

          for FILE in "${FILES[@]}"; do
            if [ -n "$FILE" ]; then
              DEPLOY_ARGS+=(--source-dir "$FILE")
            fi
          done

          sf project deploy start \
            --target-org UAT \
            "${DEPLOY_ARGS[@]}" \
            --wait 60
